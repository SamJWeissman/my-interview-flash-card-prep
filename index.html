<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f172a">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<title>Flashcard Prep</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0f172a;
  --surface: #1e293b;
  --card: #ffffff;
  --card-back: #f0f9ff;
  --text: #f8fafc;
  --text-muted: #94a3b8;
  --accent: #38bdf8;
  --danger: #f87171;
  --success: #34d399;
  --radius: 16px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

html, body {
  height: 100%;
  overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif;
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  touch-action: none;
  overscroll-behavior: none;
}

body {
  display: flex;
  flex-direction: column;
  padding-top: var(--safe-top);
  padding-bottom: var(--safe-bottom);
}

/* Top bar */
.topbar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 12px 16px;
  flex-shrink: 0;
}

.topbar .deck-name {
  flex: 1;
  font-size: 17px;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  min-width: 0;
}

.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 14px;
  border: none;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: opacity 0.15s;
  -webkit-user-select: none;
  user-select: none;
}

.btn:active { opacity: 0.7; }

.btn-upload {
  background: var(--accent);
  color: #0f172a;
}

.btn-reset {
  background: rgba(248,113,113,0.15);
  color: var(--danger);
}

.btn-sample {
  background: var(--accent);
  color: #0f172a;
  padding: 12px 24px;
  font-size: 16px;
  border-radius: 12px;
}

#file-input { display: none; }

/* Main area */
.main {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  overflow: hidden;
  position: relative;
}

/* Card */
.card-container {
  width: 100%;
  max-width: 400px;
  aspect-ratio: 3 / 4;
  max-height: 70vh;
  perspective: 1200px;
  position: relative;
}

.card-wrapper {
  width: 100%;
  height: 100%;
  position: absolute;
  will-change: transform, opacity;
}

.card {
  width: 100%;
  height: 100%;
  position: relative;
  transform-style: preserve-3d;
  transition: transform 0.5s cubic-bezier(0.4, 0.0, 0.2, 1);
  cursor: pointer;
}

.card.flipped {
  transform: rotateY(180deg);
}

.card-face {
  position: absolute;
  inset: 0;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  border-radius: var(--radius);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 28px;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}

.card-front {
  background: var(--card);
  color: #1e293b;
  box-shadow: 0 8px 32px rgba(0,0,0,0.25);
}

.card-back {
  background: var(--card-back);
  color: #1e293b;
  transform: rotateY(180deg);
  box-shadow: 0 8px 32px rgba(0,0,0,0.25);
}

.card-label {
  position: absolute;
  top: 16px;
  left: 20px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: #94a3b8;
}

.card-text {
  font-size: 20px;
  line-height: 1.5;
  text-align: center;
  word-break: break-word;
  white-space: pre-wrap;
}

/* Bottom */
.bottom {
  flex-shrink: 0;
  text-align: center;
  padding: 12px 16px 16px;
}

.progress {
  font-size: 15px;
  color: var(--text-muted);
  font-variant-numeric: tabular-nums;
}

/* Empty state */
.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 20px;
  text-align: center;
  padding: 32px;
  flex: 1;
}

.empty-state .icon {
  font-size: 64px;
  line-height: 1;
}

.empty-state h2 {
  font-size: 22px;
  font-weight: 700;
}

.empty-state p {
  font-size: 15px;
  color: var(--text-muted);
  max-width: 280px;
  line-height: 1.5;
}

.hidden { display: none !important; }

/* Swipe hint arrows */
.swipe-hint {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  font-size: 24px;
  color: var(--text-muted);
  opacity: 0.3;
  pointer-events: none;
}
.swipe-hint.left { left: 4px; }
.swipe-hint.right { right: 4px; }

/* Shuffle button */
.btn-shuffle {
  background: rgba(56,189,248,0.15);
  color: var(--accent);
}

/* Add card button */
.btn-add {
  background: rgba(52,211,153,0.15);
  color: var(--success);
  font-size: 18px;
  padding: 6px 12px;
  line-height: 1;
}

/* Edit button on card back */
.card-edit-btn {
  position: absolute;
  bottom: 16px;
  right: 16px;
  background: var(--accent);
  color: #0f172a;
  border: none;
  border-radius: 10px;
  padding: 8px 16px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 5px;
  -webkit-user-select: none;
  user-select: none;
  z-index: 2;
}
.card-edit-btn:active { opacity: 0.7; }

/* Cancel X button (top-right of card) */
.card-cancel-x {
  position: absolute;
  top: 10px;
  right: 12px;
  background: none;
  border: none;
  font-size: 22px;
  color: #94a3b8;
  cursor: pointer;
  padding: 6px 10px;
  line-height: 1;
  z-index: 3;
  -webkit-user-select: none;
  user-select: none;
}
.card-cancel-x:active { color: var(--danger); }

/* Textarea for editing / adding */
.card-textarea {
  width: 100%;
  flex: 1;
  min-height: 80px;
  max-height: 100%;
  border: 2px solid var(--accent);
  border-radius: 10px;
  padding: 14px;
  font-family: inherit;
  font-size: 18px;
  line-height: 1.5;
  color: #1e293b;
  background: #fff;
  resize: none;
  outline: none;
  white-space: pre-wrap;
  word-break: break-word;
}
.card-textarea:focus {
  border-color: #0ea5e9;
  box-shadow: 0 0 0 3px rgba(14,165,233,0.2);
}

/* Card action buttons row */
.card-actions {
  display: flex;
  gap: 10px;
  margin-top: 12px;
  width: 100%;
  justify-content: center;
}

.card-action-btn {
  border: none;
  border-radius: 10px;
  padding: 10px 24px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  -webkit-user-select: none;
  user-select: none;
  min-height: 44px;
}
.card-action-btn:active { opacity: 0.7; }

.card-action-btn.primary {
  background: var(--accent);
  color: #0f172a;
}
.card-action-btn.save {
  background: var(--success);
  color: #0f172a;
}

/* Validation message */
.card-validation {
  font-size: 13px;
  color: var(--danger);
  margin-top: 6px;
  min-height: 18px;
  text-align: center;
}

/* Edit/Add mode: card face layout adjustment */
.card-face.form-mode {
  justify-content: flex-start;
  padding-top: 48px;
  gap: 0;
}

/* Edit mode visual border */
.card-face.editing-mode {
  border: 3px solid var(--accent);
}
</style>
</head>
<body>

<div class="topbar">
  <span class="deck-name" id="deck-name"></span>
  <button class="btn btn-add hidden" id="add-btn">+</button>
  <button class="btn btn-upload" id="upload-btn">Upload CSV</button>
  <input type="file" id="file-input" accept=".csv,text/csv">
  <button class="btn btn-shuffle hidden" id="shuffle-btn">Shuffle</button>
  <button class="btn btn-reset hidden" id="reset-btn">Reset</button>
</div>

<div class="empty-state" id="empty-state">
  <div class="icon">📇</div>
  <h2>Flashcard Prep</h2>
  <p>Upload a CSV file with <strong>question</strong> and <strong>answer</strong> columns to get started.</p>
  <button class="btn btn-sample" id="sample-btn">Load Sample Deck</button>
</div>

<div class="main hidden" id="main-area">
  <span class="swipe-hint left">‹</span>
  <span class="swipe-hint right">›</span>
  <div class="card-container" id="card-container">
    <div class="card-wrapper" id="card-wrapper">
      <div class="card" id="card">
        <div class="card-face card-front" id="card-front">
          <span class="card-label" id="front-label">Question</span>
          <div class="card-text" id="front-text"></div>
        </div>
        <div class="card-face card-back" id="card-back">
          <span class="card-label" id="back-label">Answer</span>
          <div class="card-text" id="back-text"></div>
          <button class="card-edit-btn" id="edit-btn">&#9998; Edit</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="bottom hidden" id="bottom">
  <div class="progress" id="progress"></div>
</div>

<script>
(function() {
  'use strict';

  // --- State ---
  let deck = [];
  let deckName = '';
  let currentIndex = 0;
  let isFlipped = false;
  let isEditing = false;
  let isAdding = false;
  let addStep = ''; // 'question' or 'answer'

  // --- DOM ---
  const $ = id => document.getElementById(id);
  const emptyState = $('empty-state');
  const mainArea = $('main-area');
  const bottom = $('bottom');
  const resetBtn = $('reset-btn');
  const shuffleBtn = $('shuffle-btn');
  const addBtn = $('add-btn');
  const uploadBtn = $('upload-btn');
  const fileInput = $('file-input');
  const sampleBtn = $('sample-btn');
  const deckNameEl = $('deck-name');
  const cardWrapper = $('card-wrapper');
  const card = $('card');
  const cardFront = $('card-front');
  const cardBack = $('card-back');
  const frontLabel = $('front-label');
  const backLabel = $('back-label');
  const frontText = $('front-text');
  const backText = $('back-text');
  const editBtn = $('edit-btn');
  const progress = $('progress');
  const cardContainer = $('card-container');

  // --- Helper: check if in a modal mode ---
  function isModalActive() {
    return isEditing || isAdding;
  }

  // --- CSV Parsing ---
  // RFC 4180 CSV parser — handles quoted fields with embedded newlines and commas
  function parseCSVRows(text) {
    const rows = [];
    let i = 0;
    const len = text.length;

    while (i < len) {
      const row = [];
      // Parse one row (may span multiple lines if fields are quoted)
      while (true) {
        let field = '';
        if (i < len && text[i] === '"') {
          // Quoted field — may contain newlines, commas, escaped quotes
          i++; // skip opening quote
          while (i < len) {
            if (text[i] === '"') {
              if (i + 1 < len && text[i + 1] === '"') {
                field += '"';
                i += 2;
              } else {
                i++; // skip closing quote
                break;
              }
            } else {
              field += text[i];
              i++;
            }
          }
        } else {
          // Unquoted field — read until comma or newline
          while (i < len && text[i] !== ',' && text[i] !== '\r' && text[i] !== '\n') {
            field += text[i];
            i++;
          }
        }
        row.push(field);

        if (i < len && text[i] === ',') {
          i++; // skip comma, continue to next field
        } else {
          break; // end of row
        }
      }
      // Skip row terminator (\r\n or \n or \r)
      if (i < len && text[i] === '\r') i++;
      if (i < len && text[i] === '\n') i++;
      rows.push(row);
    }
    return rows;
  }

  function parseCSV(text) {
    const rows = parseCSVRows(text);
    if (rows.length < 2) return [];

    const headers = rows[0].map(h => h.trim().toLowerCase());
    const qIdx = headers.indexOf('question');
    const aIdx = headers.indexOf('answer');

    const qi = qIdx >= 0 ? qIdx : 0;
    const ai = aIdx >= 0 ? aIdx : 1;
    const startRow = (qIdx >= 0 || aIdx >= 0) ? 1 : 0;

    const cards = [];
    for (let i = startRow; i < rows.length; i++) {
      const row = rows[i];
      if (row.length < 2) continue;
      const q = (row[qi] || '').trim();
      const a = (row[ai] || '').trim();
      if (q || a) cards.push({ q, a });
    }
    return cards;
  }

  // --- Storage ---
  function saveDeck() {
    localStorage.setItem('fc_deck', JSON.stringify(deck));
    localStorage.setItem('fc_name', deckName);
    localStorage.setItem('fc_index', currentIndex);
  }

  function loadDeck() {
    const raw = localStorage.getItem('fc_deck');
    if (raw) {
      deck = JSON.parse(raw);
      deckName = localStorage.getItem('fc_name') || '';
      currentIndex = parseInt(localStorage.getItem('fc_index') || '0', 10);
      if (currentIndex >= deck.length) currentIndex = 0;
      return true;
    }
    return false;
  }

  function clearDeck() {
    localStorage.removeItem('fc_deck');
    localStorage.removeItem('fc_name');
    localStorage.removeItem('fc_index');
    deck = [];
    deckName = '';
    currentIndex = 0;
    isFlipped = false;
    render();
  }

  // --- Rendering ---
  function render() {
    if (deck.length === 0) {
      emptyState.classList.remove('hidden');
      mainArea.classList.add('hidden');
      bottom.classList.add('hidden');
      resetBtn.classList.add('hidden');
      shuffleBtn.classList.add('hidden');
      addBtn.classList.add('hidden');
      deckNameEl.textContent = '';
      return;
    }

    emptyState.classList.add('hidden');
    mainArea.classList.remove('hidden');
    bottom.classList.remove('hidden');
    resetBtn.classList.remove('hidden');
    shuffleBtn.classList.remove('hidden');
    addBtn.classList.remove('hidden');
    deckNameEl.textContent = deckName;

    showCard(currentIndex);
  }

  function showCard(idx) {
    const c = deck[idx];
    exitEditMode(true);
    restoreCardFaces();
    frontText.textContent = c.q;
    backText.textContent = c.a;
    editBtn.classList.remove('hidden');
    isFlipped = false;
    card.classList.remove('flipped');
    progress.textContent = (idx + 1) + ' / ' + deck.length;
  }

  // Restore card faces to normal read mode (remove any form elements)
  function restoreCardFaces() {
    // Front face
    frontLabel.textContent = 'Question';
    frontText.classList.remove('hidden');
    cardFront.classList.remove('form-mode', 'editing-mode');
    removeFormElements(cardFront);

    // Back face
    backLabel.textContent = 'Answer';
    backText.classList.remove('hidden');
    cardBack.classList.remove('form-mode', 'editing-mode');
    removeFormElements(cardBack);
    editBtn.classList.remove('hidden');
  }

  function removeFormElements(face) {
    face.querySelectorAll('.card-textarea, .card-actions, .card-cancel-x, .card-validation').forEach(el => el.remove());
  }

  // --- Edit Answer ---
  function enterEditMode() {
    if (isEditing || isAdding) return;
    isEditing = true;

    editBtn.classList.add('hidden');
    backText.classList.add('hidden');
    cardBack.classList.add('form-mode', 'editing-mode');

    // Cancel X
    const cancelX = document.createElement('button');
    cancelX.className = 'card-cancel-x';
    cancelX.textContent = '\u00d7';
    cancelX.addEventListener('click', e => { e.stopPropagation(); exitEditMode(false); });
    cardBack.appendChild(cancelX);

    // Textarea
    const ta = document.createElement('textarea');
    ta.className = 'card-textarea';
    ta.value = deck[currentIndex].a;
    ta.addEventListener('pointerdown', e => e.stopPropagation());
    ta.addEventListener('pointermove', e => e.stopPropagation());
    ta.style.touchAction = 'auto';
    cardBack.appendChild(ta);

    // Actions
    const actions = document.createElement('div');
    actions.className = 'card-actions';
    const saveBtn = document.createElement('button');
    saveBtn.className = 'card-action-btn save';
    saveBtn.textContent = 'Save';
    saveBtn.addEventListener('click', e => {
      e.stopPropagation();
      deck[currentIndex].a = ta.value.trim();
      saveDeck();
      exitEditMode(false);
      backText.textContent = deck[currentIndex].a;
    });
    actions.appendChild(saveBtn);
    cardBack.appendChild(actions);

    requestAnimationFrame(() => ta.focus());
  }

  function exitEditMode(silent) {
    if (!isEditing) return;
    isEditing = false;

    cardBack.classList.remove('form-mode', 'editing-mode');
    removeFormElements(cardBack);
    backText.classList.remove('hidden');
    editBtn.classList.remove('hidden');
  }

  editBtn.addEventListener('pointerdown', e => e.stopPropagation());
  editBtn.addEventListener('click', e => {
    e.stopPropagation();
    enterEditMode();
  });

  // --- Add New Card ---
  let addQuestion = '';

  function startAddCard() {
    if (isEditing || isAdding) return;
    isAdding = true;
    addStep = 'question';
    addQuestion = '';

    // Show main area even if deck was empty
    emptyState.classList.add('hidden');
    mainArea.classList.remove('hidden');
    bottom.classList.remove('hidden');

    // Show question input on front face
    setupAddQuestionFace();

    // Ensure card is on front (question) side
    isFlipped = false;
    card.classList.remove('flipped');
    progress.textContent = 'New card';
  }

  function setupAddQuestionFace() {
    frontText.classList.add('hidden');
    editBtn.classList.add('hidden');
    backText.classList.add('hidden');
    cardFront.classList.add('form-mode');
    frontLabel.textContent = 'New Question';

    // Cancel X
    const cancelX = document.createElement('button');
    cancelX.className = 'card-cancel-x';
    cancelX.textContent = '\u00d7';
    cancelX.addEventListener('click', e => { e.stopPropagation(); cancelAddCard(); });
    cardFront.appendChild(cancelX);

    // Textarea
    const ta = document.createElement('textarea');
    ta.className = 'card-textarea';
    ta.placeholder = 'Type your question\u2026';
    ta.addEventListener('pointerdown', e => e.stopPropagation());
    ta.addEventListener('pointermove', e => e.stopPropagation());
    ta.style.touchAction = 'auto';
    cardFront.appendChild(ta);

    // Validation
    const val = document.createElement('div');
    val.className = 'card-validation';
    cardFront.appendChild(val);

    // Actions
    const actions = document.createElement('div');
    actions.className = 'card-actions';
    const nextBtn = document.createElement('button');
    nextBtn.className = 'card-action-btn primary';
    nextBtn.textContent = 'Next \u2192';
    nextBtn.addEventListener('click', e => {
      e.stopPropagation();
      const q = ta.value.trim();
      if (!q) {
        val.textContent = 'Question cannot be empty.';
        return;
      }
      addQuestion = q;
      goToAddAnswer();
    });
    actions.appendChild(nextBtn);
    cardFront.appendChild(actions);

    requestAnimationFrame(() => ta.focus());
  }

  function goToAddAnswer() {
    addStep = 'answer';

    // Clean front face form elements but keep hidden state
    removeFormElements(cardFront);
    cardFront.classList.remove('form-mode');

    // Setup back face for answer input
    backText.classList.add('hidden');
    editBtn.classList.add('hidden');
    cardBack.classList.add('form-mode');
    backLabel.textContent = 'New Answer';

    // Cancel X
    const cancelX = document.createElement('button');
    cancelX.className = 'card-cancel-x';
    cancelX.textContent = '\u00d7';
    cancelX.addEventListener('click', e => { e.stopPropagation(); cancelAddCard(); });
    cardBack.appendChild(cancelX);

    // Textarea
    const ta = document.createElement('textarea');
    ta.className = 'card-textarea';
    ta.placeholder = 'Type your answer\u2026';
    ta.addEventListener('pointerdown', e => e.stopPropagation());
    ta.addEventListener('pointermove', e => e.stopPropagation());
    ta.style.touchAction = 'auto';
    cardBack.appendChild(ta);

    // Validation
    const val = document.createElement('div');
    val.className = 'card-validation';
    cardBack.appendChild(val);

    // Actions
    const actions = document.createElement('div');
    actions.className = 'card-actions';
    const saveBtn = document.createElement('button');
    saveBtn.className = 'card-action-btn save';
    saveBtn.textContent = 'Save';
    saveBtn.addEventListener('click', e => {
      e.stopPropagation();
      const a = ta.value.trim();
      if (!a) {
        val.textContent = 'Answer cannot be empty.';
        return;
      }
      finishAddCard(addQuestion, a);
    });
    actions.appendChild(saveBtn);
    cardBack.appendChild(actions);

    // Flip to back
    isFlipped = true;
    card.classList.add('flipped');

    requestAnimationFrame(() => ta.focus());
  }

  function finishAddCard(q, a) {
    deck.push({ q, a });
    currentIndex = deck.length - 1;
    isAdding = false;
    addStep = '';
    saveDeck();
    render();
  }

  function cancelAddCard() {
    isAdding = false;
    addStep = '';
    restoreCardFaces();

    if (deck.length === 0) {
      mainArea.classList.add('hidden');
      bottom.classList.add('hidden');
      emptyState.classList.remove('hidden');
    } else {
      showCard(currentIndex);
    }
  }

  addBtn.addEventListener('click', startAddCard);

  // --- File handling ---
  uploadBtn.addEventListener('click', () => fileInput.click());

  fileInput.addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      const parsed = parseCSV(ev.target.result);
      if (parsed.length === 0) {
        alert('No valid cards found. Make sure your CSV has question and answer columns.');
        return;
      }
      if (isAdding) cancelAddCard();
      if (isEditing) exitEditMode(true);
      deck = parsed;
      deckName = file.name.replace(/\.csv$/i, '');
      currentIndex = 0;
      isFlipped = false;
      saveDeck();
      render();
    };
    reader.readAsText(file);
    fileInput.value = '';
  });

  resetBtn.addEventListener('click', () => {
    if (confirm('Clear this deck?')) {
      if (isAdding) cancelAddCard();
      if (isEditing) exitEditMode(true);
      clearDeck();
    }
  });

  shuffleBtn.addEventListener('click', () => {
    if (isAdding || isEditing) return;
    for (let i = deck.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [deck[i], deck[j]] = [deck[j], deck[i]];
    }
    currentIndex = 0;
    isFlipped = false;
    saveDeck();
    render();
  });

  // --- Sample deck ---
  sampleBtn.addEventListener('click', () => {
    deck = [
      { q: 'What is the time complexity of binary search?', a: 'O(log n)' },
      { q: 'What is a hash table?', a: 'A data structure that maps keys to values using a hash function for O(1) average lookup.' },
      { q: 'Explain the difference between a stack and a queue.', a: 'Stack: LIFO (Last In, First Out)\nQueue: FIFO (First In, First Out)' },
      { q: 'What is Big O notation?', a: 'A mathematical notation describing the upper bound of an algorithm\'s growth rate as input size increases.' },
      { q: 'What is a linked list?', a: 'A linear data structure where each element (node) contains data and a pointer to the next node.' },
      { q: 'What is memoization?', a: 'An optimization technique that caches the results of expensive function calls and returns the cached result for repeated inputs.' },
      { q: 'What is the difference between BFS and DFS?', a: 'BFS explores level by level (uses a queue).\nDFS explores as deep as possible first (uses a stack/recursion).' },
      { q: 'What is a binary search tree (BST)?', a: 'A binary tree where left children are smaller and right children are larger than the parent node.' },
      { q: 'What is dynamic programming?', a: 'Solving complex problems by breaking them into overlapping subproblems and storing their solutions.' },
      { q: 'What is the CAP theorem?', a: 'A distributed system can only guarantee two of three: Consistency, Availability, Partition tolerance.' },
    ];
    deckName = 'Sample – CS Interview';
    currentIndex = 0;
    isFlipped = false;
    saveDeck();
    render();
  });

  // --- Gestures ---
  const TAP_DISTANCE = 10;
  const SWIPE_THRESHOLD_RATIO = 0.25;

  let pointerDown = false;
  let startX = 0;
  let startY = 0;
  let currentX = 0;
  let currentY = 0;
  let isSwiping = false;
  let containerWidth = 0;

  function onPointerDown(e) {
    if (deck.length === 0 || isModalActive()) return;
    pointerDown = true;
    isSwiping = false;
    startX = e.clientX;
    startY = e.clientY;
    currentX = startX;
    currentY = startY;
    containerWidth = cardContainer.offsetWidth;
    cardWrapper.style.transition = 'none';
  }

  function onPointerMove(e) {
    if (!pointerDown || isModalActive()) return;
    currentX = e.clientX;
    currentY = e.clientY;
    const dx = currentX - startX;

    if (!isSwiping && Math.abs(dx) >= TAP_DISTANCE) {
      isSwiping = true;
    }

    if (isSwiping) {
      e.preventDefault();
      const pct = dx / containerWidth;
      const rotation = pct * 15;
      const opacity = 1 - Math.abs(pct) * 0.4;
      cardWrapper.style.transform = `translateX(${dx}px) rotate(${rotation}deg)`;
      cardWrapper.style.opacity = Math.max(0.3, opacity);
    }
  }

  function onPointerUp(e) {
    if (!pointerDown || isModalActive()) return;
    pointerDown = false;

    const endX = e.clientX;
    const endY = e.clientY;
    const dx = endX - startX;
    const dy = endY - startY;
    const distance = Math.sqrt(dx * dx + dy * dy);

    if (distance < TAP_DISTANCE) {
      // Tap → flip immediately
      isFlipped = !isFlipped;
      card.classList.toggle('flipped', isFlipped);
      return;
    }

    const pct = dx / containerWidth;

    if (Math.abs(pct) > SWIPE_THRESHOLD_RATIO) {
      // Swipe past threshold → navigate
      const dir = dx > 0 ? 1 : -1; // 1 = right (prev), -1 = left (next)
      const exitX = dir * containerWidth * 1.5;
      const exitRot = dir * 30;

      cardWrapper.style.transition = 'transform 0.25s ease-out, opacity 0.25s ease-out';
      cardWrapper.style.transform = `translateX(${exitX}px) rotate(${exitRot}deg)`;
      cardWrapper.style.opacity = '0';

      setTimeout(() => {
        // Update index
        if (dir === -1) {
          currentIndex = (currentIndex + 1) % deck.length;
        } else {
          currentIndex = (currentIndex - 1 + deck.length) % deck.length;
        }
        saveDeck();
        showCard(currentIndex);

        // Animate new card in from opposite side
        cardWrapper.style.transition = 'none';
        cardWrapper.style.transform = `translateX(${-dir * containerWidth * 0.5}px) rotate(${-dir * 10}deg)`;
        cardWrapper.style.opacity = '0.3';

        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            cardWrapper.style.transition = 'transform 0.3s cubic-bezier(0.2, 0.9, 0.3, 1), opacity 0.3s ease-out';
            cardWrapper.style.transform = 'translateX(0) rotate(0)';
            cardWrapper.style.opacity = '1';
          });
        });
      }, 250);
    } else {
      // Snap back
      cardWrapper.style.transition = 'transform 0.3s cubic-bezier(0.2, 0.9, 0.3, 1), opacity 0.3s ease-out';
      cardWrapper.style.transform = 'translateX(0) rotate(0)';
      cardWrapper.style.opacity = '1';
    }
  }

  // Pointer events (unified touch + mouse)
  cardContainer.addEventListener('pointerdown', e => {
    onPointerDown(e);
    if (!isModalActive()) cardContainer.setPointerCapture(e.pointerId);
  });
  cardContainer.addEventListener('pointermove', onPointerMove);
  cardContainer.addEventListener('pointerup', onPointerUp);
  cardContainer.addEventListener('pointercancel', onPointerUp);

  // Prevent scroll/overscroll during swipe
  cardContainer.style.touchAction = 'none';
  document.addEventListener('touchmove', e => {
    if (isSwiping) e.preventDefault();
  }, { passive: false });

  // --- Service Worker ---
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }

  // --- Init ---
  loadDeck();
  render();
})();
</script>
</body>
</html>
